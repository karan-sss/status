# Upptime: uptime checks every 5 minutes from GitHub Actions, status page on
# GitHub Pages at status.karan-s.com. Infra lives in karan-sss/project-infra.
owner: karan-sss
repo: status

sites:
  - name: Portfolio
    url: https://karan-s.com
    expectedStatusCodes:
      - 200

assignees:
  - karan-sss

status-website:
  cname: status.karan-s.com
  name: karan-s.com status
  introTitle: "Status of **karan-s.com**"
  introMessage: Self-hosted on one Hetzner ARM server behind Cloudflare. Checked every 5 minutes from GitHub Actions. Infrastructure as code in [project-infra](https://github.com/karan-sss/project-infra).
  navbar:
    - title: Status
      href: /
    - title: Infrastructure
      href: https://github.com/karan-sss/project-infra
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
